name: hcc-data
services:
  kafka-storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${HCC_KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    ports:
      - '127.0.0.1:${HCC_KAFKA_PORT:-9094}:9094'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      HCC_TOPIC_CORE: ${HCC_TOPIC_CORE:-hcc.core.events,hcc.audit.events.v1}
      HCC_TOPIC_AUTH: ${HCC_TOPIC_AUTH:-hcc.auth.events}
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        for topic in $$(printf "%s,%s" "$$HCC_TOPIC_CORE" "$$HCC_TOPIC_AUTH" | tr , " "); do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done
    restart: "no"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HCC_POSTGRES_ADMIN_PASSWORD:?Set HCC_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: hcc_data
      HCC_DB_MIGRATOR_PASSWORD: ${HCC_DB_MIGRATOR_PASSWORD:?Set HCC_DB_MIGRATOR_PASSWORD}
      HCC_DB_APP_PASSWORD: ${HCC_DB_APP_PASSWORD:?Set HCC_DB_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    ports:
      - '127.0.0.1:${HCC_POSTGRES_PORT:-5445}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hcc_data']
      interval: 5s
      timeout: 3s
      retries: 20

  data:
    build: .
    restart: unless-stopped
    environment:
      SPRING_FLYWAY_LOCATIONS: ${HCC_FLYWAY_LOCATIONS:-classpath:db/migration}
      JDBC_URL: jdbc:postgresql://postgres:5432/hcc_data?currentSchema=hcc_data
      HCC_DB_APP_USER: hcc_app
      HCC_DB_APP_PASSWORD: ${HCC_DB_APP_PASSWORD:?Set HCC_DB_APP_PASSWORD}
      HCC_DB_MIGRATOR_USER: hcc_migrator
      HCC_DB_MIGRATOR_PASSWORD: ${HCC_DB_MIGRATOR_PASSWORD:?Set HCC_DB_MIGRATOR_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HCC_TOPIC_CORE: ${HCC_TOPIC_CORE:-hcc.core.events,hcc.audit.events.v1}
      HCC_TOPIC_AUTH: ${HCC_TOPIC_AUTH:-hcc.auth.events}
      HCC_SECURITY_MODE: ${HCC_SECURITY_MODE:-demo}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      HCC_JWT_ISSUER_URI: ${HCC_JWT_ISSUER_URI:-}
      HCC_DEMO_SUPERVISOR_TOKEN: ${HCC_DEMO_SUPERVISOR_TOKEN:?Set HCC_DEMO_SUPERVISOR_TOKEN}
      HCC_DEMO_AUDITOR_TOKEN: ${HCC_DEMO_AUDITOR_TOKEN:?Set HCC_DEMO_AUDITOR_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${HCC_DATA_PORT:-8090}:8090'
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - data
    ports:
      - '127.0.0.1:${HCC_FRONTEND_PORT:-5173}:8080'
volumes:
  kafka_data:
  postgres_data:
